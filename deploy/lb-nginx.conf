# Lb01: round-robin load balancer in front of Web01 and Web02.
# Replace WEB01_IP and WEB02_IP, then save as /etc/nginx/sites-available/default (or conf.d/lb.conf).
upstream app_servers {
    server WEB01_IP:80 max_fails=3 fail_timeout=10s;
    server WEB02_IP:80 max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Shows which backend answered each request (used in the demo)
    add_header X-Served-By $upstream_addr always;

    location / {
        proxy_pass http://app_servers;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
